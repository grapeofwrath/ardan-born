name: ArdanBorn
version: '${version}'
main: dev.grapeofwrath.ardanborn.ArdanBorn
bootstrapper: dev.grapeofwrath.ardanborn.ArdanBornBootstrap
api-version: '${apiVersion}'
description: Tolkien origins for Origins-Reborn and custom armor sets
authors: [grapeofwrath]

dependencies:
  server:
    # Main class extends Origins-Reborn's OriginsAddon, so it must be loaded first and visible to us.
    Origins-Reborn:
      load: BEFORE
      required: true
      join-classpath: true
    # Optional Origins-Reborn addons whose powers some of our origins use (see README).
    # Without them those powers are simply missing; the origins still load.
    Origins-Fantasy:
      load: BEFORE
      required: false
    Origins-Magic:
      load: BEFORE
      required: false
    Origins-Mobs:
      load: BEFORE
      required: false
    Origins-Monsters:
      load: BEFORE
      required: false
    # Optional: Morgul wounds read mob levels from it (see config.yml). No code dependency.
    LevelledMobs:
      load: BEFORE
      required: false
  bootstrap: {}

permissions:
  ardanborn.give:
    description: Use /ardanborn give to get ArdanBorn custom items
    default: op
