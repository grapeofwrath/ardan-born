# ArdanBorn settings. Delete a setting (or the whole file) to get its default back.

morgul-wound:
  # Melee hits from undead can leave a Morgul wound that worsens in stages until treated.
  enabled: true
  # Chance per melee hit from an eligible mob (0.10 = 10%).
  chance: 0.10
  # Chance per melee hit from a Servant of the Enemy or a Ringwraith (sent by a betraying ring, a
  # new-moon hunt, or the Eye in the Nether).
  servant-chance: 0.50
  # With LevelledMobs installed: the lowest mob level that can wound. Keep it in step with your
  # LevelledMobs rules. Without LevelledMobs, only wither skeletons and the servants of a betraying
  # Ring of Power can wound.
  min-level: 30
  # Minutes (while the wounded player is online) before the wound worsens to the next stage.
  stage-minutes: 3

race-items:
  # How strong race items are: bonus damage, damage reduction, damage dealt, healing and chances. 1.0 is
  # normal; try 1.5 if mobs are tough (high LevelledMobs levels). From 0.5 to 3.0.
  # Cooldowns, ranges, speed and durations don't change.
  power: 1.0
  # A power level for single items or armor effects, instead of the one above, e.g.
  #   sting: 1.5
  overrides: {}
  # Items and armor effects that do nothing, e.g. [sting, fellowship]
  disabled: []

rohirrim:
  # The most that Charge of the Mark, Spear-hardy, the Spear of the Mark and Death! can add to melee damage
  # together (0.60 = 60%).
  damage-bonus-cap: 0.60

mearas:
  # Chance that a horse is one of the Mearas: a foal bred by one of the Rohirrim, or a wild horse in the plains
  # (0.02 = 2%). Each horse is rolled once.
  chance: 0.02
  # Chance that a new Meara is Shadowfax, while there is no Shadowfax in the world (0.20 = 20%).
  shadowfax-chance: 0.20
