baseURL = "https://grapeofwrath.github.io/ardan-born/"
title = "ArdanBorn"
locale = "en"
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap"]
enableRobotsTXT = false

[params]
repo = "https://github.com/grapeofwrath/ardan-born"

[markup.goldmark.parser]
autoHeadingIDType = "github"

# Lets a page put a class on a block, e.g. {.verse} on the line after a poem.
[markup.goldmark.parser.attribute]
block = true

[markup.goldmark.renderer]
unsafe = false

[markup.highlight]
noClasses = false
codeFences = false
