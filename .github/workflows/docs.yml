name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/docs/**"
      - "src/main/resources/origins/**"
      - "src/main/java/dev/grapeofwrath/ardanborn/origins/OriginAbilities.java"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.170.0"
  PAGEFIND_VERSION: "1.6.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check generated pages are up to date
        run: |
          perl tools/docs/generate.pl
          if ! git diff --exit-code docs/content; then
            echo "::error::docs/content is out of date. Run 'perl tools/docs/generate.pl' and commit the result."
            exit 1
          fi

      - name: Install Hugo and Pagefind
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C "$bin" hugo
          curl -fsSL "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$bin" pagefind
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          hugo -s docs --minify --panicOnWarning
          pagefind --site docs/public

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
